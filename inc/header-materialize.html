  <header>
    <div class="navbar-fixed">
      <nav class="white">
        <div class="nav-wrapper row">
          <div class="col s12">
            <a id="logo-container" class="brand-logo" href="{$bat.path}/">

            <a href="#!" data-target="sidenav-left" class="sidenav-trigger right tooltipped" data-position="bottom" data-tooltip="Otwórz ustawienia mapy" >

            </a>
            <ul class="right map-layer tooltipped" data-position="bottom" data-tooltip="Zmień warstwy mapy">

                <ul id="dropdown-map" class="dropdown-content" tabindex="0" style="">
                </ul>
              </li>
            </ul>
            <ul class="right map-search tooltipped" data-position="bottom" data-tooltip="Wyszukiwarka miejsc i miejscowości">
              <li class=""><a class="dropdown-trigger map-dropdown" href="#!" data-target="dropdown-search" ><i
                    class="material-icons right">search</i></a>
                <ul id="dropdown-search" class="dropdown-content" tabindex="0" style="">
                </ul>
                <div id="search-results-container"></div>
              </li>
            </ul>

            <ul class="right hide-on-med-and-down">
              <li id="jak_korzystac" class="tooltipped" data-position="bottom" data-tooltip="Uruchm przewodnik">Jak korzystać z mapy?</li>
              {$navigation.main}


            </ul>
          </div>
        </div>
      </nav>

    <nav style="height: auto;">
      <ul id="sidenav-left" class="sidenav" style="transform: translateX(-105%);">
        <li>
          <div class="switch">
            <label>
              <input id="mapgest_switch" type="checkbox" checked>
              <span class="lever"></span>
              Przesuwanie mapy z CTRL / gestem
            </label>
          </div>
        </li>
        <li>
          <div class="switch">
            <label>
              <input id="googleads_switch" type="checkbox" checked>

            </label>
          </div>
        </li>
        <li>
          <div class="switch">
            <label>
              <input id="elepointslimit_switch" type="checkbox" checked>

            </label>
          </div>
        </li>
        <li>
          <div class="switch">
            <label>
              <input id="contextmenu_switch" type="checkbox" checked>
              <span class="lever"></span>

            </label>
          </div>
        </li>
        <li>
          <div class="switch">
            <label>

              <span class="lever"></span>

            </label>
          </div>
        </li>
        {$navigation.main}
